{% extends "blog/base.html" %}
{%load crispy_forms_tags %}
{% load static %}
{%block head%}
    <link rel="stylesheet" href="{% static 'users/register.css'%}">
{%endblock%}


{% block title%}
    {% comment %} <h1>Join today!</h1> {% endcomment %}
{% endblock title%}

{%block post-card%}
        
        <form method = "POST">
            {% csrf_token %}
            <fieldset class = "form-group">  
                <legend class = "border-bottom mb-4">Reset Password</legend>
                {{form|crispy}}
            </fieldset>
            
            <div class="form-group mt-3 mb-3">
                <button type = 'submit' class = "btn  btn-outline" >Request Password Reset</button>
            </div>
            
        </form>
        
    

    
               
{%endblock post-card%}
