name: blog-docker-project

services:
  app:
    # we can comment the build part if we already have an image
    build: 
      context: .
      dockerfile: Dockerfile
    image: django-blog-image
    container_name: django-blog-docker-container
    ports:
      - "8000:8000"

    environment:
      - USE_POSTGRES=True
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_HOST=db
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
    
    volumes:
      - .:/app
    depends_on:
      - db


  db:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 
volumes:
      postgres_data:
  


    


